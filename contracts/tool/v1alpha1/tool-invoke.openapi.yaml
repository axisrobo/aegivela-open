openapi: 3.1.0
info:
  title: AEGIVELA Tool Invocation
  version: v1alpha1
  description: Versioned tool:invoke adapter contract binding a grant to an exact tool implementation.
paths:
  /v1/tool/invoke:
    post:
      summary: Authorize a tool invocation
      operationId: toolInvoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInvokeRequest"
      responses:
        "200":
          description: Tool invocation authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvokeResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthenticated
        "403":
          description: Authorization denied
        "503":
          description: Authorization unavailable
components:
  schemas:
    ResourceRef:
      type: object
      required: [kind, reference]
      properties:
        kind: { type: string }
        reference: { type: string }
      additionalProperties: false
    ToolInvokeRequest:
      type: object
      required:
        - api_version
        - bearer_token
        - action
        - resource
        - scope
        - execution_id
        - tool_id
        - skill_hash
        - implementation_digest
        - trace_id
      properties:
        api_version:
          const: aegivela.io/v1alpha1
        bearer_token: { type: string }
        action: { const: tool:invoke }
        resource: { $ref: "#/components/schemas/ResourceRef" }
        scope:
          type: array
          minItems: 1
          items: { type: string }
        approval_artifact: { type: string }
        execution_id: { type: string }
        tool_id: { type: string }
        skill_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        implementation_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        trace_id: { type: string }
      additionalProperties: false
    ToolInvokeResponse:
      type: object
      required: [api_version, decision_id, outcome, policy_version, tenant_id, actor_id, tool_id, grant_token]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        decision_id: { type: string }
        outcome: { type: string }
        policy_version: { type: string }
        tenant_id: { type: string }
        actor_id: { type: string }
        tool_id: { type: string }
        grant_token: { type: string }
        evidence_refs:
          type: array
          items: { type: string }
      additionalProperties: false
