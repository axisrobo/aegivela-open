openapi: 3.1.0
info:
  title: AEGIVELA Tool Invocation
  version: v1alpha1
  description: Versioned tool:invoke adapter contract binding a grant to an exact tool implementation.
paths:
  /v1/tool/invoke:
    post:
      summary: Authorize a tool invocation
      operationId: toolInvoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolInvokeRequest"
      responses:
        "200":
          description: Tool invocation authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolInvokeResponse"
        "400":
          description: Invalid request
        "401":
          description: Unauthenticated
        "403":
          description: Authorization denied
        "503":
          description: Authorization unavailable
components:
  schemas:
    ResourceRef:
      type: object
      required: [kind, reference]
      properties:
        kind: { type: string }
        reference: { type: string }
      additionalProperties: false
    ToolInvokeRequest:
      type: object
      required:
        - apiVersion
        - bearerToken
        - action
        - resource
        - scope
        - executionId
        - toolId
        - skillHash
        - implementationDigest
        - traceId
      properties:
        apiVersion:
          const: aegivela.io/v2.0
        bearerToken: { type: string }
        action: { const: tool:invoke }
        resource: { $ref: "#/components/schemas/ResourceRef" }
        scope:
          type: array
          minItems: 1
          items: { type: string }
        approvalArtifact: { type: string }
        executionId: { type: string }
        toolId: { type: string }
        skillHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        implementationDigest: { type: string, pattern: "^[0-9a-f]{64}$" }
        traceId: { type: string }
      additionalProperties: false
    ToolInvokeResponse:
      type: object
      required: [apiVersion, decisionId, outcome, policyVersion, actorId, toolId, grantToken]
      properties:
        apiVersion: { const: aegivela.io/v2.0 }
        decisionId: { type: string }
        outcome: { type: string }
        policyVersion: { type: string }
        actorId: { type: string }
        toolId: { type: string }
        grantToken: { type: string }
        evidenceRefs:
          type: array
          items: { type: string }
      additionalProperties: false
