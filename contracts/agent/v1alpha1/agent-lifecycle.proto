syntax = "proto3";

package agent.v1alpha1;

option go_package = "github.com/axisrobo/aegivela/backend/internal/agentcontract/pb;pb";

import "google/protobuf/timestamp.proto";

service AgentLifecycleService {
  rpc Register(AgentRegisterRequest) returns (AgentRecord);
  rpc Get(AgentGetRequest) returns (AgentRecord);
  rpc Enroll(AgentEnrollRequest) returns (AgentEnrollResponse);
  rpc Activate(AgentTransitionRequest) returns (AgentRecord);
  rpc Suspend(AgentTransitionRequest) returns (AgentRecord);
  rpc Revoke(AgentTransitionRequest) returns (AgentRecord);
}

enum AgentClass {
  AGENT_CLASS_UNSPECIFIED = 0;
  TWIN = 1;
  SERVICE = 2;
}

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  CREATED = 1;
  ACTIVE = 2;
  SUSPENDED = 3;
  REVOKED = 4;
}

enum EnrollmentStrategy {
  ENROLLMENT_STRATEGY_UNSPECIFIED = 0;
  DEVICE_BACKED = 1;
  HUMAN_AUTHORIZED = 2;
  API_ONLY = 3;
}

message AgentRegisterRequest {
  string agent_id = 1;
  AgentClass agent_class = 2;
  optional string master_id = 3;
  optional string organization_authority_root = 4;
  repeated string maximum_scopes = 5;
  string workload_selector = 6;
}

message AgentGetRequest {
  string agent_id = 1;
}

message AgentTransitionRequest {
  string agent_id = 1;
}

message AgentEnrollRequest {
  repeated EnrollmentStrategy strategies = 1;
  optional string workload_assertion = 2;
  optional string bearer_token = 3;
  optional string audience = 4;
}

message AgentEnrollResponse {
  string api_version = 1;
  string agent_id = 2;
  LifecycleState lifecycle_state = 3;
  int64 lifecycle_epoch = 4;
  string evidence_ref = 5;
  repeated EnrollmentStrategy strategies = 6;
}

message AgentRecord {
  string api_version = 1;
  string agent_id = 2;
  AgentClass agent_class = 3;
  string authority_root = 4;
  LifecycleState lifecycle_state = 5;
  int64 lifecycle_epoch = 6;
  repeated string maximum_scopes = 7;
  string workload_selector = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}
