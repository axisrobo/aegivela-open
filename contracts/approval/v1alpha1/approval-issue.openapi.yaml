openapi: 3.1.0
info:
  title: AEGIVELA Approval API
  version: v1alpha1
paths:
  /v1/approvals/issue:
    post:
      operationId: issueApproval
      parameters:
        - name: X-AEGIVELA-PEP
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalIssueRequest'
      responses:
        '200':
          description: Issued approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalIssueResponse'
        '400':
          $ref: '#/components/responses/InvalidApprovalRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '503':
          $ref: '#/components/responses/RevocationUnavailable'
components:
  responses:
    InvalidApprovalRequest:
      description: invalid_approval_request
    Unauthenticated:
      description: unauthenticated
    AuthorizationDenied:
      description: authorization_denied
    RevocationUnavailable:
      description: revocation_unavailable
  schemas:
    ApprovalIssueRequest:
      type: object
      additionalProperties: false
      required: [api_version, bearer_token, action, resource, scope, expiry, reason, policy_version, trace_id]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        bearer_token: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        resource:
          type: object
          additionalProperties: false
          required: [kind, reference]
          properties:
            kind: { type: string, minLength: 1 }
            reference: { type: string, minLength: 1 }
        scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        expiry: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        policy_version: { type: string, minLength: 1 }
        session: { type: string, minLength: 1 }
        lifecycle: { type: string, minLength: 1 }
        evidence_refs: { type: array, items: { type: string, minLength: 1 } }
        trace_id: { type: string, minLength: 1 }
    ApprovalIssueResponse:
      type: object
      additionalProperties: false
      required: [api_version, approval_id, principal, action, resource, scope, expires_at, issued_at, reason, policy_version, evidence_refs]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        approval_id: { type: string, minLength: 1 }
        principal:
          type: object
          additionalProperties: false
          required: [tenant_id, actor_ref]
          properties:
            tenant_id: { type: string, minLength: 1 }
            subject_ref: { type: string, minLength: 1 }
            actor_ref: { type: string, minLength: 1 }
            client_id: { type: string, minLength: 1 }
            workload_ref: { type: string, minLength: 1 }
            agent_id: { type: string, minLength: 1 }
            agent_class: { type: string }
            master_id: { type: string, minLength: 1 }
            organization_authority_root: { type: string, minLength: 1 }
            lifecycle_epoch: { type: integer, minimum: 0 }
            attestation_ref: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
        resource:
          type: object
          additionalProperties: false
          required: [kind, reference]
          properties:
            kind: { type: string, minLength: 1 }
            reference: { type: string, minLength: 1 }
        scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        expires_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        policy_version: { type: string, minLength: 1 }
        session: { type: string, minLength: 1 }
        lifecycle: { type: string, minLength: 1 }
        evidence_refs: { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
