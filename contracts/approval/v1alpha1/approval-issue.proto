syntax = "proto3";

package approval.v1alpha1;

option go_package = "github.com/axisrobo/aegivela/backend/internal/approvalcontract/pb;pb";

import "google/protobuf/timestamp.proto";

service ApprovalService {
  rpc Issue(ApprovalIssueRequest) returns (ApprovalIssueResponse);
}

message Principal {
  string tenant_id = 1;
  optional string subject_ref = 2;
  string actor_ref = 3;
  optional string client_id = 4;
  optional string workload_ref = 5;
  optional string agent_id = 6;
  optional string agent_class = 7;
  optional string master_id = 8;
  optional string organization_authority_root = 9;
  optional int64 lifecycle_epoch = 10;
  optional string attestation_ref = 11;
}

message ResourceRef {
  string kind = 1;
  string reference = 2;
}

message ApprovalIssueRequest {
  string api_version = 1;
  string bearer_token = 2;
  string action = 3;
  ResourceRef resource = 4;
  repeated string scope = 5;
  google.protobuf.Timestamp expiry = 6;
  string reason = 7;
  string policy_version = 8;
  optional string session = 9;
  optional string lifecycle = 10;
  repeated string evidence_refs = 11;
  string trace_id = 12;
}

message ApprovalIssueResponse {
  string api_version = 1;
  string approval_id = 2;
  Principal principal = 3;
  string action = 4;
  ResourceRef resource = 5;
  repeated string scope = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp issued_at = 8;
  string reason = 9;
  string policy_version = 10;
  optional string session = 11;
  optional string lifecycle = 12;
  repeated string evidence_refs = 13;
}
