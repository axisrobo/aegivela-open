syntax = "proto3";

package decision.v1alpha1;

option go_package = "github.com/axisrobo/aegivela/backend/internal/decisioncontract/pb;pb";

import "google/protobuf/timestamp.proto";

service PolicyDecisionVerificationService {
  rpc Verify(PolicyDecisionVerifyRequest) returns (PolicyDecisionVerifyResponse);
}

enum DecisionOutcome {
  DECISION_OUTCOME_UNSPECIFIED = 0;
  ALLOW = 1;
  DENY = 2;
  APPROVAL_REQUIRED = 3;
  REVOKED = 4;
}

message Principal {
  string tenant_id = 1;
  optional string subject_ref = 2;
  string actor_ref = 3;
  optional string client_id = 4;
  optional string workload_ref = 5;
  optional string agent_id = 6;
  optional string agent_class = 7;
  optional string master_id = 8;
  optional string organization_authority_root = 9;
  optional int64 lifecycle_epoch = 10;
  optional string attestation_ref = 11;
}

message ResourceRef {
  string kind = 1;
  string reference = 2;
}

message ExpectedDecisionBindings {
  Principal principal = 1;
  string action = 2;
  ResourceRef resource = 3;
  repeated string scope = 4;
  optional string audience = 5;
  optional string trace_id = 6;
}

message PolicyDecisionVerifyRequest {
  string api_version = 1;
  string signed_decision = 2;
  ExpectedDecisionBindings expected_bindings = 3;
}

message PolicyDecisionVerifyResponse {
  string api_version = 1;
  string decision_id = 2;
  bool valid = 3;
  DecisionOutcome outcome = 4;
  string policy_version = 5;
  google.protobuf.Timestamp expires_at = 6;
  repeated string obligations = 7;
  repeated string evidence_refs = 8;
  bool revoked = 9;
}
