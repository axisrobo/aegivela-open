openapi: 3.1.0
info:
  title: AEGIVELA Policy Decision API
  version: v1alpha2
paths:
  /v1/policy/decisions/evaluate:
    post:
      operationId: evaluatePolicyDecisionV1Alpha2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDecisionRequest'
      responses:
        '200':
          description: Policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecisionResponse'
        '400': { $ref: '#/components/responses/InvalidPolicyRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/PolicyUnavailable' }
components:
  responses:
    InvalidPolicyRequest: { description: invalid_policy_request }
    Unauthenticated: { description: unauthenticated }
    PolicyUnavailable: { description: policy_unavailable }
  schemas:
    PolicyDecisionRequest:
      type: object
      additionalProperties: false
      required: [api_version, authorization_mode, principal, action, resource, requested_scope, audience, requested_expires_at, trace_id]
      properties:
        api_version: { const: aegivela.io/v1alpha2 }
        authorization_mode: { type: string, enum: [human_web, system_api, delegated_api, service_agent_api, twin_agent_api] }
        principal: { $ref: '#/components/schemas/Principal' }
        action: { type: string, minLength: 1 }
        resource: { $ref: '#/components/schemas/Resource' }
        requested_scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        audience: { type: string, minLength: 1 }
        requested_expires_at: { type: string, format: date-time }
        task_binding: { type: string, minLength: 1 }
        parent_authority: { $ref: '#/components/schemas/ParentAuthority' }
        risk_context: { $ref: '#/components/schemas/RiskContext' }
        trace_id: { type: string, minLength: 1 }
      allOf:
        - if: { properties: { authorization_mode: { const: human_web } } }
          then:
            properties:
              principal:
                allOf:
                  - required: [subject_ref]
                  - not: { anyOf: [{ required: [agent_id] }, { required: [master_id] }, { required: [organization_authority_root] }] }
        - if: { properties: { authorization_mode: { const: system_api } } }
          then:
            properties:
              principal:
                allOf:
                  - required: [organization_authority_root, client_id, workload_ref]
                  - not: { anyOf: [{ required: [subject_ref] }, { required: [master_id] }] }
        - if: { properties: { authorization_mode: { const: delegated_api } } }
          then:
            required: [parent_authority]
            properties:
              principal:
                allOf:
                  - required: [subject_ref, client_id, workload_ref]
                  - not: { anyOf: [{ required: [agent_id] }, { required: [master_id] }] }
        - if: { properties: { authorization_mode: { const: service_agent_api } } }
          then:
            required: [parent_authority]
            properties:
              principal:
                allOf:
                  - required: [agent_id, agent_class, organization_authority_root, workload_ref, lifecycle_epoch]
                  - properties: { agent_class: { const: service } }
                  - not: { required: [master_id] }
        - if: { properties: { authorization_mode: { const: twin_agent_api } } }
          then:
            required: [parent_authority]
            properties:
              principal:
                allOf:
                  - required: [agent_id, agent_class, master_id, workload_ref, lifecycle_epoch]
                  - properties: { agent_class: { const: twin } }
                  - not: { required: [organization_authority_root] }
    PolicyDecisionResponse:
      type: object
      additionalProperties: false
      required: [api_version, structured_resource_digest, decision_id, outcome, policy_version, expires_at, obligations, evidence_refs]
      properties:
        api_version: { const: aegivela.io/v1alpha2 }
        structured_resource_digest: { type: string, pattern: '^[0-9a-f]{64}$' }
        decision_id: { type: string, minLength: 1 }
        outcome: { type: string, enum: [allow, deny, approval_required, revoked] }
        policy_version: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
        obligations: { type: array, items: { type: string, minLength: 1 } }
        evidence_refs: { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
    Principal:
      type: object
      additionalProperties: false
      required: [tenant_id, actor_ref]
      properties:
        tenant_id: { type: string, minLength: 1 }
        subject_ref: { type: string, minLength: 1 }
        actor_ref: { type: string, minLength: 1 }
        client_id: { type: string, minLength: 1 }
        workload_ref: { type: string, minLength: 1 }
        agent_id: { type: string, minLength: 1 }
        agent_class: { type: string }
        master_id: { type: string, minLength: 1 }
        organization_authority_root: { type: string, minLength: 1 }
        lifecycle_epoch: { type: integer, minimum: 0 }
        attestation_ref: { type: string, minLength: 1 }
    ParentAuthority:
      type: object
      additionalProperties: false
      required: [authority_ref, parent_scope, parent_audience, parent_expires_at, parent_task_binding]
      properties:
        authority_ref: { type: string, minLength: 1 }
        parent_scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        parent_audience: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        parent_expires_at: { type: string, format: date-time }
        parent_task_binding: { type: string, minLength: 1 }
    Resource:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties:
        kind: { type: string, minLength: 1 }
        reference: { type: string, minLength: 1 }
        product_id: { type: string, minLength: 1 }
        resource_type: { type: string, minLength: 1 }
        descriptor_id: { type: string, minLength: 1 }
        descriptor_version: { type: string, minLength: 1 }
        attributes: { type: object }
      allOf:
        - if: { anyOf: [{ required: [product_id] }, { required: [resource_type] }, { required: [descriptor_id] }, { required: [descriptor_version] }, { required: [attributes] }] }
          then: { required: [product_id, resource_type, descriptor_id, descriptor_version, attributes] }
    RiskContext:
      type: object
      additionalProperties: false
      properties:
        risk_level: { type: string }
        risk_ref: { type: string }
