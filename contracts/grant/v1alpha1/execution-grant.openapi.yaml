openapi: 3.1.0
info:
  title: AEGIVELA Execution Grant API
  version: v1alpha1
paths:
  /v1/grants/issue:
    post:
      operationId: issueGrant
      parameters:
        - name: X-AEGIVELA-PEP
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantIssueRequest'
      responses:
        '200':
          description: Issued grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantIssueResponse'
        '400':
          $ref: '#/components/responses/InvalidGrantRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '503':
          $ref: '#/components/responses/RevocationUnavailable'
  /v1/grants/verify:
    post:
      operationId: verifyGrant
      parameters:
        - name: X-AEGIVELA-PEP
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantVerifyRequest'
      responses:
        '200':
          description: Grant verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantVerifyResponse'
        '400':
          $ref: '#/components/responses/InvalidGrantRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '503':
          $ref: '#/components/responses/RevocationUnavailable'
  /v1/grants/jwks:
    get:
      operationId: getGrantJWKS
      responses:
        '200':
          description: Public JWKS
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  responses:
    InvalidGrantRequest:
      description: invalid_grant_request
    Unauthenticated:
      description: unauthenticated
    AuthorizationDenied:
      description: authorization_denied
    RevocationUnavailable:
      description: revocation_unavailable
  schemas:
    GrantIssueRequest:
      type: object
      additionalProperties: false
      required: [api_version, bearer_token, signed_allow_decision, requested_scope, trace_id]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        bearer_token: { type: string, minLength: 1 }
        signed_allow_decision: { type: string, minLength: 1 }
        requested_scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        pre_authorization_jti: { type: string, minLength: 1 }
        approval_jti: { type: string, minLength: 1 }
        trace_id: { type: string, minLength: 1 }
    GrantIssueResponse:
      type: object
      additionalProperties: false
      required: [api_version, grant_id, principal, scope, audience, expires_at, issued_at, evidence_refs]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        grant_id: { type: string, minLength: 1 }
        principal:
          type: object
          additionalProperties: false
          required: [tenant_id, actor_ref]
          properties:
            tenant_id: { type: string, minLength: 1 }
            subject_ref: { type: string, minLength: 1 }
            actor_ref: { type: string, minLength: 1 }
            client_id: { type: string, minLength: 1 }
            workload_ref: { type: string, minLength: 1 }
            agent_id: { type: string, minLength: 1 }
            agent_class: { type: string }
            master_id: { type: string, minLength: 1 }
            organization_authority_root: { type: string, minLength: 1 }
            lifecycle_epoch: { type: integer, minimum: 0 }
            attestation_ref: { type: string, minLength: 1 }
        scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        audience: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        task_binding: { type: string, minLength: 1 }
        pre_authorization_jti: { type: string, minLength: 1 }
        approval_jti: { type: string, minLength: 1 }
        evidence_refs: { type: array, items: { type: string, minLength: 1 }, minItems: 1 }
    GrantVerifyRequest:
      type: object
      additionalProperties: false
      required: [api_version, signed_grant, expected_bindings]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        signed_grant: { type: string, minLength: 1 }
        expected_bindings:
          type: object
          additionalProperties: false
          required: [audience, scope]
          properties:
            audience: { type: string, minLength: 1 }
            scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
            task_binding: { type: string, minLength: 1 }
            trace_id: { type: string, minLength: 1 }
    GrantVerifyResponse:
      type: object
      additionalProperties: false
      required: [api_version, grant_id, valid, principal, scope, audience, expires_at]
      properties:
        api_version: { const: aegivela.io/v1alpha1 }
        grant_id: { type: string, minLength: 1 }
        valid: { type: boolean }
        principal:
          type: object
          additionalProperties: false
          required: [tenant_id, actor_ref]
          properties:
            tenant_id: { type: string, minLength: 1 }
            subject_ref: { type: string, minLength: 1 }
            actor_ref: { type: string, minLength: 1 }
            client_id: { type: string, minLength: 1 }
            workload_ref: { type: string, minLength: 1 }
            agent_id: { type: string, minLength: 1 }
            agent_class: { type: string }
            master_id: { type: string, minLength: 1 }
            organization_authority_root: { type: string, minLength: 1 }
            lifecycle_epoch: { type: integer, minimum: 0 }
            attestation_ref: { type: string, minLength: 1 }
        scope: { type: array, items: { type: string, minLength: 1 }, minItems: 1, uniqueItems: true }
        audience: { type: string, minLength: 1 }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
        revoked: { type: boolean }
        revocation_check_epoch: { type: integer, minimum: 0 }
