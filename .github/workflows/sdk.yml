name: SDK

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
      - name: Build SDK
        working-directory: sdk/go
        run: go build ./...
      - name: Build examples
        working-directory: examples/web-api-pep
        run: go build ./...
